<!DOCTYPE html>
<html>
<head>
    <title>Result Page</title>

    <link rel="shortcut icon" type="image/png"
          href="{{ url_for('static', filename='images/icon.png') }}">

    <link rel="stylesheet" type="text/css"
          href="{{ url_for('static', filename='css/style_result.css') }}">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>

    <img id="logo"
         src="{{ url_for('static', filename='images/logo.png') }}">

    <div class="container">

        <div class="row">
            <img id="heading"
                 src="{{ url_for('static', filename='images/result4.png') }}">
        </div>

        <br>

        <!-- Prediction Result -->
        <div class="text-center">
            <h2>
                Prediction:
                <span style="color:green;">
                    {{ prediction }}
                </span>
            </h2>
        </div>

        <br>

        <div class="row">
            <div class="col-sm">
                <button type="button" class="btn btn-danger btn-lg">
                    Malaria Cell
                </button>
            </div>

            <div class="col-sm">
                <button type="button" class="btn btn-success btn-lg">
                    Not Malaria Cell
                </button>
            </div>
        </div>

        <br>

        <img id="result1"
             src="{{ url_for('static', filename='images/result1.png') }}">

        <img id="result2"
             src="{{ url_for('static', filename='images/result2.png') }}">

        <img id="result3"
             src="{{ url_for('static', filename='images/result3.png') }}">

        <br><br>

        <div class="text-center">
            <a href="/form" class="btn btn-primary">
                Upload Another Image
            </a>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
